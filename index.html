<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Climb Training Coach</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212f;--muted:#667085;--line:#e4e7ec;--complete:#1f9d55;--purple:#6d45d9;--orange:#c96b00;--blue:#2878c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}
header{background:#111827;color:white;padding:22px 16px 18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:720px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.daytabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.daytabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 14px;font-weight:700}.daytabs button.active{background:#111827;color:white}
.progress{height:9px;background:#e7e9ee;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#111827}
.step{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;background:white;transition:.15s}.step.completed{background:#eaf8ef;border-color:#1f9d55;box-shadow:0 0 0 2px #bde8cc}.step.completed .stephead{background:#eaf8ef!important;border-left-color:#1f9d55!important}.step.completed .check{background:#dff3e5}.stephead{padding:14px 15px;border-left:7px solid #888}
.step.warmup .stephead{border-color:#c96b00;background:#fff6e8}.step.stretch .stephead{border-color:#2878c8;background:#eef6fd}.step.climbing .stephead{border-color:#6d45d9;background:#f4f0ff}.step.warmdown .stephead{border-color:#c96b00;background:#fff6e8}.step.training .stephead{border-color:#667085;background:#f7f8fa}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 7px;border-radius:999px;background:#e9ecf1;margin-bottom:7px}.climbing .tag{background:#e5ddff;color:#5432ae}.warmup .tag{background:#ffe8c3;color:#8b4c00}.stretch .tag{background:#dceeff;color:#1d5f9d}.warmdown .tag{background:#ffe8c3;color:#8b4c00}
h2,h3{margin:4px 0 8px}.target{color:var(--muted);font-size:14px;line-height:1.45}.timeLabel{font-size:12px;font-weight:800;color:var(--muted);margin-top:10px}.timer{font-size:42px;font-variant-numeric:tabular-nums;text-align:center;font-weight:800;margin:5px 0}.timer.done{color:#18212f}
.row{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800;background:#111827;color:white}.btn.secondary{background:#edf0f4;color:#202938}.btn.purple{background:#6d45d9}.btn:disabled{opacity:.45;cursor:default}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;background:#f7f8fa;border-radius:12px;font-weight:700}.check input{width:21px;height:21px}
.climbbox{margin-top:14px;padding:13px;border-radius:14px;background:#faf9ff;border:1px solid #ded6ff}.climbnav{display:flex;gap:7px;overflow:auto;margin:9px 0}.climbnav button{min-width:88px;border:1px solid #d8d0ff;background:white;border-radius:10px;padding:9px;font-weight:800}.climbnav button.active{background:#6d45d9;color:white}
.attempts{font-size:18px;font-weight:900;margin:10px 0}.attempt{padding:10px;border-top:1px solid #e5e1f5;font-size:13px}.attempt .status{font-weight:800}.rest{font-size:12px;color:var(--muted);margin-top:8px}
footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px;z-index:10}footer button{flex:1;max-width:180px;border:0;background:#f1f3f6;border-radius:10px;padding:10px;font-weight:800}footer button.active{background:#111827;color:white}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f8fa;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.small{font-size:12px;color:var(--muted)}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center}.complete{color:var(--green)}
</style><style>
.step.climbing .climbbox{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.attempt{position:relative;padding:9px 42px 9px 10px}
.deleteAttempt{position:absolute;right:7px;top:7px;width:32px;height:32px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:18px;line-height:1}
</style>
</head><body>

let state=JSON.parse(localStorage.getItem("climbCoachV4")||"{}");
state.day=Number.isInteger(state.day)?state.day:0;state.completed=state.completed||{};state.climbs=state.climbs||{};state.timers=state.timers||{};state.active=state.active||{};
let view=state.view||"workout",handles={};
function save(){localStorage.setItem("climbCoachV4",JSON.stringify(state))}
function key(di,si){return di+"-"+si}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function label(c){return c==="warmup"?"WARM-UP":c==="stretch"?"STRETCH / MOBILITY":c==="climbing"?"CLIMBING":c==="warmdown"?"WARM-DOWN":"TRAINING"}
function done(di,si){return !!state.completed[key(di,si)]}
function climbs(di,si){let k=key(di,si),s=DAYS[di].steps[si],n=s.climbs||0;if(!state.climbs[k])state.climbs[k]=[];while(state.climbs[k].length<n)state.climbs[k].push({attempts:[]});return state.climbs[k]}
function complete(di,si,v){state.completed[key(di,si)]=v;save();render()}
function start(di,si){let k=key(di,si),s=DAYS[di].steps[si];if(handles[k])return;if(state.timers[k]==null||state.timers[k]<=0)state.timers[k]=s.duration;handles[k]=setInterval(()=>{state.timers[k]=Math.max(0,state.timers[k]-1);let e=document.getElementById("tm-"+k);if(e){e.textContent=state.timers[k]===0?"DONE!":fmt(state.timers[k]);e.classList.toggle("done",state.timers[k]===0)}if(state.timers[k]===0){clearInterval(handles[k]);delete handles[k];try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}save()},1000);render()}
function pause(di,si){let k=key(di,si);if(handles[k]){clearInterval(handles[k]);delete handles[k]}save();render()}
function reset(di,si){let k=key(di,si);if(handles[k]){clearInterval(handles[k]);delete handles[k]}state.timers[k]=DAYS[di].steps[si].duration;save();render()}
function selectClimb(di,si,ci){state.active[key(di,si)]=ci;save();render()}
function attempt(di,si,ci,result){let c=climbs(di,si)[ci];if(!c||c.attempts.length>=5)return;c.attempts.push({result,at:new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})});save();render()}
function deleteAttempt(di,si,ci,ai){let c=climbs(di,si)[ci];if(!c||!c.attempts[ai])return;c.attempts.splice(ai,1);save();render()}
function focus(s,n){let t=(s.name+" "+s.target).toLowerCase();if(t.includes("flag"))return ["Read the line and identify where the flag will create balance.","Use an inside/outside flag deliberately on the key move.","Repeat with better hip position and less pulling.","Link the flag smoothly into the next sequence.","Best attempt: quiet feet, stable hips and controlled reach."][n];if(t.includes("foot")||t.includes("edging")||t.includes("smear"))return ["Identify the foothold before moving.","Place the toe precisely and transfer weight onto it.","Reduce foot readjustments and keep hips over the feet.","Repeat with deliberate, quiet footwork.","Best attempt: precise feet from start to finish."][n];if(t.includes("dynamic")||t.includes("deadpoint"))return ["Read the target and identify the movement timing.","Drive from the legs and reach under control.","Adjust timing or body position deliberately.","Catch and stabilize without unnecessary swing.","Best attempt: powerful but controlled movement."][n];if(t.includes("project")||t.includes("crux")||t.includes("hard")||t.includes("power"))return ["Read the problem and identify the crux.","Make a full quality attempt and note the failure point.","Work the hardest movement with fresh technique.","Link the crux to the preceding section.","Best attempt: full link with quality movement."][n];return ["Read the climb: start, sequence, feet, crux and rests.","Make a controlled quality attempt.","Repeat with one deliberate technical adjustment.","Apply the adjustment efficiently.","Best attempt: smooth, efficient climbing."][n]}
function renderWorkout(){let d=DAYS[state.day],n=d.steps.length,c=d.steps.filter((s,i)=>done(state.day,i)).length,p=Math.round(c/n*100);document.getElementById("app").innerHTML='<div class="daytabs">'+DAYS.map((x,i)=>'<button class="'+(i===state.day?"active":"")+'" onclick="state.day='+i+';save();render()">Day '+(i+1)+'</button>').join("")+'</div><div class="card"><div class="summary"><div><div class="small">TRAINING DAY</div><h2>'+esc(d.name)+'</h2></div><b>'+p+'%</b></div><div class="progress" style="margin-top:10px"><div style="width:'+p+'%"></div></div><div class="small" style="margin-top:7px">'+c+' of '+n+' steps complete</div></div>'+d.steps.map((s,i)=>renderStep(s,i)).join("")}
function renderStep(s,i){let di=state.day,k=key(di,i),left=state.timers[k]??s.duration,running=!!handles[k],isDone=done(di,i),out='<div class="step '+s.category+(isDone?" completed":"")+'"><div class="stephead"><div class="tag">'+label(s.category)+'</div><h3>Step '+s.displayStep+' — '+esc(s.name)+'</h3><div class="target"><b>Target:</b> '+esc(s.target)+'</div>'+(s.sets?'<div class="small" style="margin-top:6px"><b>Volume:</b> '+esc(s.sets)+(s.rest?' • <b>Rest:</b> '+esc(s.rest):"")+'</div>':"")+'<div class="timeLabel">TIME FOR THIS STEP: '+fmt(s.duration)+'</div><div class="timer '+(left===0?"done":"")+'" id="tm-'+k+'">'+(left===0?"DONE!":fmt(left))+'</div><div class="row"><button class="btn" onclick="'+(running?"pause":"start")+'('+di+','+i+')">'+(running?"Pause":"Start")+' Timer</button><button class="btn secondary" onclick="reset('+di+','+i+')">Reset</button></div></div>';
if(s.notes&&s.notes.length)out+='<div class="notes"><b>COACHING NOTES</b>'+s.notes.map(x=>'<div>• '+esc(x)+'</div>').join("")+'</div>';
if(s.isClimb)out+=renderClimbing(s,i);
out+='<label class="check"><input type="checkbox" '+(isDone?"checked":"")+' onchange="complete('+di+','+i+',this.checked)"><span><b>'+(isDone?"✓ STEP COMPLETE":"Mark STEP complete")+'</b><br><span class="small">Climbs and attempts are part of this step.</span></span></label></div>';return out}
function renderClimbing(s,i){let di=state.day,k=key(di,i),cs=climbs(di,i),active=Math.min(state.active[k]||0,Math.max(0,cs.length-1));state.active[k]=active;let c=cs[active];return '<div class="climbbox"><b>CLIMBS IN THIS STEP</b><div class="small">The timer above covers the entire step. It continues while moving between climbs. There is no separate climb checkbox.</div><div class="climbnav">'+cs.map((x,n)=>'<button class="'+(n===active?"active":"")+'" onclick="selectClimb('+di+','+i+','+n+')">Climb '+(n+1)+'<br><span class="small">'+x.attempts.length+'/5 attempts</span></button>').join("")+'</div><h3>🧗 Climb '+(active+1)+' of '+cs.length+'</h3><div class="attempts">Attempts: '+c.attempts.length+' / 5</div>'+c.attempts.map((a,n)=>'<div class="attempt"><button class="deleteAttempt" title="Delete attempt" aria-label="Delete attempt" onclick="deleteAttempt('+di+','+i+','+active+','+n+')">×</button><b>Attempt '+(n+1)+'</b> — <span class="status">'+esc(a.result)+'</span><br><span class="small"><b>Focus:</b> '+esc(focus(s,n))+' • '+esc(a.at)+'</span></div>').join("")+(c.attempts.length<5?'<div class="row" style="margin-top:8px"><button class="btn purple" onclick="attempt('+di+','+i+','+active+',\'SEND ✓\')">Record SEND</button><button class="btn secondary" onclick="attempt('+di+','+i+','+active+',\'PARTIAL ◐\')">Partial</button><button class="btn secondary" onclick="attempt('+di+','+i+','+active+',\'FALL ✕\')">Fall / Fail</button></div>':'<div class="small complete" style="margin-top:8px">5-attempt maximum reached for this climb.</div>')+'<div class="rest">'+(s.rest?"Planned rest: "+esc(s.rest):"Complete the climb(s) within the step timer and keep quality high.")+'</div></div>'}
function renderProgress(){let total=0,doneN=0,att=0,sends=0;DAYS.forEach((d,di)=>d.steps.forEach((s,si)=>{total++;if(done(di,si))doneN++;if(s.isClimb)climbs(di,si).forEach(c=>c.attempts.forEach(a=>{att++;if(a.result.includes("SEND"))sends++}))}));document.getElementById("app").innerHTML='<div class="card"><h2>Progress Dashboard</h2><div class="statgrid"><div class="stat"><b>'+doneN+'</b><span>steps complete</span></div><div class="stat"><b>'+att+'</b><span>climbing attempts</span></div><div class="stat"><b>'+sends+'</b><span>sends logged</span></div></div></div><div class="card"><h3>How the workout works</h3><p class="small">Every numbered activity has its own timer. Climbing activities contain the individual climbs and up to 5 attempts per climb. Items that were notes in the source plan are shown as coaching notes instead of separate steps.</p></div>'}
function render(){state.view=view;save();document.getElementById("workBtn").classList.toggle("active",view==="workout");document.getElementById("progBtn").classList.toggle("active",view==="progress");view==="workout"?renderWorkout():renderProgress()}
render();
</script></body></html>
