let state=JSON.parse(localStorage.getItem("climbCoachV3")||"{}");
state.day=Number.isInteger(state.day)?state.day:0;
state.completed=state.completed||{};
state.climbs=state.climbs||{};
state.timers=state.timers||{};
let view=state.view||"workout";
let timerHandles={};

function save(){localStorage.setItem("climbCoachV3",JSON.stringify(state))}
function key(di,si){return di+"-"+si}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function catLabel(c){return c==="warmup"?"WARM-UP":c==="stretch"?"STRETCH / MOBILITY":c==="climbing"?"CLIMBING":c==="warmdown"?"WARM-DOWN":"TRAINING"}
function stepDone(di,si){return !!state.completed[key(di,si)]}

function stepDuration(s){
  // Use the actual time assigned to THIS step.
  // Explicit minute values such as "2 min" win over the larger schedule block.
  const fields=[String(s.sets||""),String(s.target||"")];
  for(const t of fields){
    const m=t.match(/^\s*(\d+)\s*(?:-|–|to)?\s*(?:\d+\s*)?min(?:ute)?s?\b/i);
    if(m)return Number(m[1])*60;
    const n=t.match(/^\s*(\d+)\s*min(?:ute)?s?\s*:/i);
    if(n)return Number(n[1])*60;
  }
  // If no explicit step duration exists, use the step's scheduled time window.
  const range=String(s.time||"").match(/(\d+):(\d+)\s*[–-]\s*(\d+):(\d+)/);
  if(range){
    const a=Number(range[1])*60+Number(range[2]);
    const b=Number(range[3])*60+Number(range[4]);
    if(b>a)return b-a;
  }
  return Number(s.duration)||300;
}

function climbState(di,si){
  const k=key(di,si);
  if(!state.climbs[k])state.climbs[k]=[];
  const n=DAYS[di].steps[si].climbs||0;
  while(state.climbs[k].length<n)state.climbs[k].push({attempts:[]});
  return state.climbs[k];
}

function recordAttempt(di,si,ci,result){
  const c=climbState(di,si)[ci];
  if(!c||c.attempts.length>=5)return;
  c.attempts.push({result:result,at:new Date().toLocaleTimeString([] ,{hour:"numeric",minute:"2-digit"})});
  save();render();
}

function setComplete(di,si,v){
  state.completed[key(di,si)]=v;
  save();render();
}

function timerStart(di,si){
  const k=key(di,si),s=DAYS[di].steps[si];
  if(timerHandles[k])return;
  if(state.timers[k]==null||state.timers[k]<=0)state.timers[k]=stepDuration(s);
  timerHandles[k]=setInterval(function(){
    state.timers[k]=Math.max(0,state.timers[k]-1);
    const el=document.getElementById("tm-"+k);
    if(el){
      el.textContent=state.timers[k]<=0?"DONE!":fmt(state.timers[k]);
      el.classList.toggle("done",state.timers[k]<=0);
    }
    if(state.timers[k]<=0){
      clearInterval(timerHandles[k]);delete timerHandles[k];
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    }
    save();
  },1000);
  render();
}

function timerPause(di,si){
  const k=key(di,si);
  if(timerHandles[k]){clearInterval(timerHandles[k]);delete timerHandles[k]}
  save();render();
}

function timerReset(di,si){
  const k=key(di,si);
  if(timerHandles[k]){clearInterval(timerHandles[k]);delete timerHandles[k]}
  state.timers[k]=stepDuration(DAYS[di].steps[si]);
  save();render();
}

function renderWorkout(){
  const d=DAYS[state.day];
  const done=d.steps.filter((_,i)=>stepDone(state.day,i)).length;
  const pct=Math.round(done/d.steps.length*100);
  document.getElementById("app").innerHTML=
    '<div class="daytabs">'+DAYS.map((x,i)=>'<button class="'+(i===state.day?"active":"")+'" onclick="state.day='+i+';save();render()">Day '+(i+1)+'</button>').join("")+'</div>'+
    '<div class="card"><div class="summary"><div><div class="small">TRAINING DAY</div><h2>'+d.name+'</h2></div><b>'+pct+'%</b></div><div class="progress" style="margin-top:10px"><div style="width:'+pct+'%"></div></div><div class="small" style="margin-top:7px">'+done+' of '+d.steps.length+' steps complete</div></div>'+
    d.steps.map((s,i)=>renderStep(s,i)).join("");
}

function renderStep(s,i){
  const di=state.day,k=key(di,i);
  const total=stepDuration(s);
  const left=state.timers[k]??total;
  const running=!!timerHandles[k];
  const completed=stepDone(di,i);
  const cs=s.isClimb?climbState(di,i):[];
  return '<div class="step '+s.category+(completed?' completed':'')+'">'+
    '<div class="stephead">'+
      '<div class="tag">'+catLabel(s.category)+'</div>'+
      '<h3>Step '+s.step+' — '+s.name+'</h3>'+
      '<div class="target"><b>Target:</b> '+(s.target||"Complete the prescribed activity with good technique.")+'</div>'+
      (s.sets?'<div class="small" style="margin-top:6px"><b>Volume:</b> '+s.sets+(s.rest?' • <b>Rest:</b> '+s.rest:'')+'</div>':'')+
      '<div class="timeLabel">TIME FOR THIS STEP: '+fmt(total)+'</div>'+
      '<div class="timer '+(left<=0?"done":"")+'" id="tm-'+k+'">'+(left<=0?"DONE!":fmt(left))+'</div>'+
      '<div class="row"><button class="btn" onclick="'+(running?"timerPause":"timerStart")+'('+di+','+i+')">'+(running?"Pause":"Start")+' Timer</button><button class="btn secondary" onclick="timerReset('+di+','+i+')">Reset</button></div>'+
    '</div>'+
    (s.isClimb?renderClimbing(s,i,cs):"")+
    '<label class="check"><input type="checkbox" '+(completed?"checked":"")+' onchange="setComplete('+di+','+i+',this.checked)"><span><b>'+(completed?"✓ STEP COMPLETE":"Mark STEP complete")+'</b><br><span class="small">Climbs and attempts are part of this step — there is no separate climb checkbox.</span></span></label>'+
  '</div>';
}

function renderClimbing(s,i,cs){
  const di=state.day;
  const prop="activeClimb-"+di+"-"+i;
  let active=state[prop]||0;
  active=Math.min(active,Math.max(0,cs.length-1));
  state[prop]=active;
  const c=cs[active]||{attempts:[]};
  return '<div class="climbbox">'+
    '<b>CLIMBS INCLUDED IN THIS STEP</b>'+
    '<div class="small">The timer above is for the ENTIRE step. It keeps running while you work through every climb in this step.</div>'+
    '<div class="climbnav">'+cs.map((x,n)=>'<button class="'+(n===active?"active":"")+'" onclick="state[\''+prop+'\']='+n+';save();render()">Climb '+(n+1)+'<br><span class="small">'+x.attempts.length+'/5 attempts</span></button>').join("")+'</div>'+
    '<h3>🧗 Climb '+(active+1)+' of '+cs.length+'</h3>'+
    '<div class="attempts">Attempts: '+c.attempts.length+' / 5</div>'+
    c.attempts.map((a,n)=>'<div class="attempt"><b>Attempt '+(n+1)+'</b> — <span class="status">'+a.result+'</span><br><span class="small"><b>Focus:</b> '+(s.attempts[n]||"Make a controlled, high-quality attempt.")+' • '+a.at+'</span></div>').join("")+
    (c.attempts.length<5?
      '<div class="row" style="margin-top:8px"><button class="btn purple" onclick="recordAttempt('+di+','+i+','+active+',\'SEND ✓\')">Record SEND</button><button class="btn secondary" onclick="recordAttempt('+di+','+i+','+active+',\'PARTIAL ◐\')">Partial</button><button class="btn secondary" onclick="recordAttempt('+di+','+i+','+active+',\'FALL ✕\')">Fall / Fail</button></div>':
      '<div class="small complete" style="margin-top:8px">5-attempt maximum reached for this climb.</div>')+
    '<div class="row" style="margin-top:9px">'+
      (active<cs.length-1?'<button class="btn secondary" onclick="state[\''+prop+'\']='+ (active+1) +';save();render()">Next Climb →</button>':'<span class="small">Last climb in this step.</span>')+
    '</div>'+
    '<div class="rest">All climbs above are part of this one step. Mark the STEP complete when the entire step is finished.</div>'+
  '</div>';
}

function renderProgress(){
  let complete=0,attempts=0,sends=0;
  DAYS.forEach((d,di)=>d.steps.forEach((s,si)=>{
    if(stepDone(di,si))complete++;
    if(s.isClimb)climbState(di,si).forEach(c=>c.attempts.forEach(a=>{
      attempts++;
      if(a.result.includes("SEND"))sends++;
    }));
  }));
  document.getElementById("app").innerHTML=
    '<div class="card"><h2>Progress Dashboard</h2><div class="statgrid"><div class="stat"><b>'+complete+'</b><span>steps complete</span></div><div class="stat"><b>'+attempts+'</b><span>climbing attempts</span></div><div class="stat"><b>'+sends+'</b><span>sends logged</span></div></div></div>'+
    '<div class="card"><h3>Training Plan</h3><p class="small">Every step has its own timer. Climbing steps contain multiple selectable climbs and up to 5 attempts per climb. Climb tracking is part of the step — only the whole step is checked complete.</p></div>';
}

function render(){
  state.view=view;save();
  document.getElementById("workBtn").classList.toggle("active",view==="workout");
  document.getElementById("progBtn").classList.toggle("active",view==="progress");
  view==="workout"?renderWorkout():renderProgress();
}
render();
</script></body></html>
