const STORAGE="climbCoachImproved1";
let state=JSON.parse(localStorage.getItem(STORAGE)||"{}");
state.day=Number.isInteger(state.day)?state.day:0;
state.completed=state.completed||{};
state.climbs=state.climbs||{};
state.timers=state.timers||{};
state.activeClimb=state.activeClimb||{};
let timerHandles={};
let view="workout";

function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function key(di,si){return di+"-"+si}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function catLabel(c){return c==="warmup"?"WARM-UP":c==="stretch"?"STRETCH / MOBILITY":c==="climbing"?"CLIMBING":c==="warmdown"?"WARM-DOWN":"TRAINING"}
function stepDone(di,si){return !!state.completed[key(di,si)]}
function escapeText(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function stepDuration(step){
  // Use the original step time window when possible. This gives each step its
  // own clearly labeled timer without changing the training content.
  const t=String(step.time||"");
  const m=t.match(/(\d+):(\d+)\s*[–-]\s*(\d+):(\d+)/);
  if(m){
    const a=Number(m[1])*60+Number(m[2]), b=Number(m[3])*60+Number(m[4]);
    if(b>a)return b-a;
  }
  const target=String(step.target||"");
  const n=target.match(/(\d+)\s*min/i);
  if(n)return Number(n[1])*60;
  return 5*60;
}

function climbState(di,si){
  const k=key(di,si), step=DAYS[di].steps[si], n=step.climbs||0;
  if(!state.climbs[k])state.climbs[k]=[];
  while(state.climbs[k].length<n)state.climbs[k].push({attempts:[],done:false});
  return state.climbs[k];
}

function toggleComplete(di,si,v){state.completed[key(di,si)]=v;save();render()}

function startTimer(di,si){
  const k=key(di,si),step=DAYS[di].steps[si];
  if(timerHandles[k])return;
  if(state.timers[k]==null||state.timers[k]<=0)state.timers[k]=stepDuration(step);
  timerHandles[k]=setInterval(function(){
    state.timers[k]=Math.max(0,state.timers[k]-1);
    const el=document.getElementById("timer-"+k);
    if(el){
      el.textContent=state.timers[k]===0?"DONE!":fmt(state.timers[k]);
      el.classList.toggle("done",state.timers[k]===0);
    }
    if(state.timers[k]===0){
      clearInterval(timerHandles[k]);delete timerHandles[k];
      try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}
    }
    save();
  },1000);
  render();
}
function pauseTimer(di,si){const k=key(di,si);if(timerHandles[k]){clearInterval(timerHandles[k]);delete timerHandles[k]}save();render()}
function resetTimer(di,si){const k=key(di,si);if(timerHandles[k]){clearInterval(timerHandles[k]);delete timerHandles[k]}state.timers[k]=stepDuration(DAYS[di].steps[si]);save();render()}

function selectClimb(di,si,ci){state.activeClimb[key(di,si)]=ci;save();render()}
function recordAttempt(di,si,ci,result){
  const cs=climbState(di,si),c=cs[ci];
  if(!c||c.attempts.length>=5)return;
  c.attempts.push({result:result,time:new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})});
  save();render();
}
function finishClimb(di,si,ci){
  const c=climbState(di,si)[ci];if(!c)return;
  c.done=true;save();render();
}
function nextClimb(di,si){
  const k=key(di,si),cs=climbState(di,si),cur=state.activeClimb[k]||0;
  if(cur<cs.length-1){state.activeClimb[k]=cur+1;save();render()}
}

function instruction(step,n){
  const x=(step.name+" "+step.target).toLowerCase();
  if(x.includes("flag"))return ["Find the best flag position before moving.","Use the flag to create balance.","Reduce upper-body pulling.","Link the flag into the next sequence.","Best-quality attempt: smooth balance."][n];
  if(x.includes("foot")||x.includes("edging")||x.includes("smear"))return ["Look at the foothold before moving.","Place the toe accurately and transfer weight.","Reduce foot readjustments.","Keep hips balanced over the feet.","Best-quality attempt: precise feet throughout."][n];
  if(x.includes("dynamic")||x.includes("deadpoint"))return ["Identify the exact target hold.","Drive from the legs and reach under control.","Adjust timing/body position.","Catch and stabilize without extra swing.","Best-quality attempt: controlled movement."][n];
  if(x.includes("project")||x.includes("crux")||x.includes("power")||x.includes("hard"))return ["Read the sequence, feet and crux.","Make a full quality attempt; note failure point.","Practice the hardest movement.","Link the crux to the preceding section.","Best-quality attempt: full link."][n];
  return ["Read the climb: start, sequence, feet, crux and rests.","Make a controlled quality attempt.","Repeat with one deliberate technical adjustment.","Apply the adjustment efficiently.","Best-quality attempt: smooth, efficient climbing."][n];
}

function renderStep(step,si){
  const di=state.day,k=key(di,si),left=state.timers[k]??stepDuration(step),running=!!timerHandles[k];
  let h='<div class="step '+step.category+'"><div class="stephead"><div class="tag">'+catLabel(step.category)+'</div><h3>Step '+step.step+' — '+escapeText(step.name)+'</h3>';
  h+='<div class="target"><b>Target:</b> '+escapeText(step.target||"Complete the prescribed activity.")+'</div>';
  if(step.sets)h+='<div class="small" style="margin-top:6px"><b>Volume:</b> '+escapeText(step.sets)+(step.rest?' • <b>Rest:</b> '+escapeText(step.rest):"")+'</div>';
  h+='<div class="timeLabel">TIME FOR THIS STEP: '+fmt(stepDuration(step))+'</div>';
  h+='<div class="timer '+(left===0?"done":"")+'" id="timer-'+k+'">'+(left===0?"DONE!":fmt(left))+'</div>';
  h+='<div class="row"><button class="btn" onclick="startTimer('+di+','+si+')">'+(running?"Running":"Start Timer")+'</button><button class="btn secondary" onclick="pauseTimer('+di+','+si+')">Pause</button><button class="btn secondary" onclick="resetTimer('+di+','+si+')">Reset</button></div></div>';
  if(step.isClimb)h+=renderClimbing(step,si);
  h+='<label class="check"><input type="checkbox" '+(stepDone(di,si)?"checked":"")+' onchange="toggleComplete('+di+','+si+',this.checked)"><span><b>'+(stepDone(di,si)?"✓ Step complete":"Mark step complete")+'</b><br><span class="small">For climbing steps, finish all required climbs first.</span></span></label></div>';
  return h;
}

function renderClimbing(step,si){
  const di=state.day,k=key(di,si),cs=climbState(di,si);
  let active=state.activeClimb[k]||0;
  active=Math.min(active,Math.max(0,cs.length-1));state.activeClimb[k]=active;
  const c=cs[active];
  let h='<div class="climbbox"><b>CLIMBING STEP</b><div class="small">One timer covers this entire step. Select each climb below; the timer continues while you move from one climb to the next.</div>';
  h+='<div class="climbnav">'+cs.map(function(x,n){return '<button class="'+(n===active?"active":"")+'" onclick="selectClimb('+di+','+si+','+n+')">Climb '+(n+1)+' '+(x.done?"✓":"")+'<br><span class="small">'+x.attempts.length+'/5 attempts</span></button>'}).join("")+'</div>';
  h+='<h3>🧗 Climb '+(active+1)+' of '+cs.length+'</h3><div class="attempts">Attempts: '+c.attempts.length+' / 5</div>';
  h+=c.attempts.map(function(a,n){return '<div class="attempt"><b>Attempt '+(n+1)+'</b> — <span class="status">'+escapeText(a.result)+'</span><br><span class="small"><b>Focus:</b> '+escapeText(instruction(step,n))+' • '+escapeText(a.time)+'</span></div>'}).join("");
  if(c.attempts.length<5){
    h+='<div class="row" style="margin-top:8px"><button class="btn purple" onclick="recordAttempt('+di+','+si+','+active+',\'SEND\')">Record SEND</button><button class="btn secondary" onclick="recordAttempt('+di+','+si+','+active+',\'PARTIAL\')">Partial</button><button class="btn secondary" onclick="recordAttempt('+di+','+si+','+active+',\'FALL / FAIL\')">Fall / Fail</button></div>';
  }else h+='<div class="small complete" style="margin-top:8px"><b>5-attempt maximum reached for this climb.</b></div>';
  h+='<div class="row" style="margin-top:9px"><button class="btn green" onclick="finishClimb('+di+','+si+','+active+')" '+(c.done?"disabled":"")+'>'+(c.done?"✓ Climb Finished":"Finish Climb "+(active+1))+'</button>';
  if(active<cs.length-1)h+='<button class="btn secondary" onclick="nextClimb('+di+','+si+')">Next Climb →</button>';
  h+='</div></div>';
  return h;
}

function renderWorkout(){
  const d=DAYS[state.day],doneCount=d.steps.filter(function(_,i){return stepDone(state.day,i)}).length,pct=Math.round(doneCount/d.steps.length*100);
  document.getElementById("app").innerHTML='<div class="daytabs">'+DAYS.map(function(x,i){return '<button class="'+(i===state.day?"active":"")+'" onclick="state.day='+i+';save();render()">Day '+(i+1)+'</button>'}).join("")+'</div>'+
  '<div class="card"><div class="summary"><div><div class="small">TRAINING DAY</div><h2>'+escapeText(d.name)+'</h2></div><b>'+pct+'%</b></div><div class="progress" style="margin-top:10px"><div style="width:'+pct+'%"></div></div><div class="small" style="margin-top:7px">'+doneCount+' of '+d.steps.length+' steps complete</div></div>'+
  d.steps.map(renderStep).join("");
}
function renderProgress(){
  let complete=0,attempts=0,sends=0;
  DAYS.forEach(function(d,di){d.steps.forEach(function(s,si){if(stepDone(di,si))complete++;if(s.isClimb)climbState(di,si).forEach(function(c){c.attempts.forEach(function(a){attempts++;if(a.result==="SEND")sends++})})})});
  document.getElementById("app").innerHTML='<div class="card"><h2>Progress Dashboard</h2><div class="statgrid"><div class="stat"><b>'+complete+'</b><span>steps complete</span></div><div class="stat"><b>'+attempts+'</b><span>climbing attempts</span></div><div class="stat"><b>'+sends+'</b><span>sends logged</span></div></div></div><div class="card"><h3>Climbing tracker</h3><p class="small">Each climbing step has one overall step timer. Each climb inside that step has its own 5-attempt tracker and detailed attempt focus.</p></div>';
}
function render(){
  document.getElementById("workBtn").classList.toggle("active",view==="workout");
  document.getElementById("progBtn").classList.toggle("active",view==="progress");
  view==="workout"?renderWorkout():renderProgress();
}
render();
</script></body></html>
